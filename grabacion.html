<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Prueba de grabación</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.5;
    }

    button {
      padding: 12px 20px;
      margin: 8px 4px 8px 0;
      font-size: 16px;
      cursor: pointer;
    }

    #estado {
      margin-top: 20px;
      font-weight: bold;
    }

    #resultado {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Prueba de grabación</h1>

  <p>Graba unos segundos y comprueba que el audio se guarda en Drive.</p>

  <button id="empezar">Empezar a grabar</button>
  <button id="detener" disabled>Detener y guardar</button>

  <p id="estado">Preparado.</p>

  <div id="resultado"></div>

  <iframe
    name="marcoOculto"
    id="marcoOculto"
    style="display:none">
  </iframe>

  <script>
    const URL_SCRIPT =
      'https://script.google.com/macros/s/AKfycbxttUSEpmIzyz19BxerSMcD0V4oohdSenJATZBr0sA-_0c4NQb3I53FWqBOvG8RbH-c/exec';

    const botonEmpezar = document.getElementById('empezar');
    const botonDetener = document.getElementById('detener');
    const estado = document.getElementById('estado');
    const resultado = document.getElementById('resultado');

    let grabadora;
    let fragmentos = [];
    let flujo;

    botonEmpezar.addEventListener('click', async () => {
      try {
        resultado.innerHTML = '';
        estado.textContent = 'Solicitando permiso para usar el micrófono...';

        flujo = await navigator.mediaDevices.getUserMedia({
          audio: true
        });

        fragmentos = [];

        const tipoPreferido = 'audio/webm;codecs=opus';

        const opciones = MediaRecorder.isTypeSupported(tipoPreferido)
          ? { mimeType: tipoPreferido }
          : {};

        grabadora = new MediaRecorder(flujo, opciones);

        grabadora.ondataavailable = evento => {
          if (evento.data.size > 0) {
            fragmentos.push(evento.data);
          }
        };

        grabadora.onstop = guardarGrabacion;

        grabadora.start();

        botonEmpezar.disabled = true;
        botonDetener.disabled = false;

        estado.textContent = 'Grabando...';

      } catch (error) {
        estado.textContent =
          'No se pudo iniciar la grabación: ' + error.message;
      }
    });

    botonDetener.addEventListener('click', () => {
      if (grabadora && grabadora.state !== 'inactive') {
        botonDetener.disabled = true;
        estado.textContent = 'Preparando el audio...';

        grabadora.stop();
        flujo.getTracks().forEach(pista => pista.stop());
      }
    });

    async function guardarGrabacion() {
      try {
        const tipo = grabadora.mimeType || 'audio/webm';

        const audio = new Blob(fragmentos, {
          type: tipo
        });

        const lector = new FileReader();

        lector.onloadend = () => {
          try {
            const base64 = lector.result.split(',')[1];

            const datos = {
              nombre: 'prueba-' + Date.now() + '.webm',
              mimeType: tipo,
              base64: base64
            };

            enviarAudio(datos);

          } catch (error) {
            estado.textContent =
              'Error al preparar el audio: ' + error.message;
            botonEmpezar.disabled = false;
          }
        };

        lector.readAsDataURL(audio);

      } catch (error) {
        estado.textContent =
          'Error al preparar la grabación: ' + error.message;
        botonEmpezar.disabled = false;
      }
    }

    function enviarAudio(datos) {
      estado.textContent = 'Enviando el audio a Google Drive...';

      const formulario = document.createElement('form');

      formulario.method = 'POST';
      formulario.action = URL_SCRIPT;
      formulario.target = 'marcoOculto';

      const campo = document.createElement('input');

      campo.type = 'hidden';
      campo.name = 'payload';
      campo.value = JSON.stringify(datos);

      formulario.appendChild(campo);
      document.body.appendChild(formulario);

      formulario.submit();
      formulario.remove();
    }

    window.addEventListener('message', evento => {
      const respuesta = evento.data;

      if (!respuesta || typeof respuesta.correcto !== 'boolean') {
        return;
      }

      if (respuesta.correcto) {
        estado.textContent = '¡Grabación guardada correctamente!';

        resultado.innerHTML =
          '<p><a href="' + respuesta.url +
          '" target="_blank" rel="noopener">Abrir el audio guardado en Drive</a></p>';

      } else {
        estado.textContent =
          'No se pudo guardar el audio: ' + respuesta.mensaje;
      }

      botonEmpezar.disabled = false;
      botonDetener.disabled = true;
    });
  </script>

</body>
</html>
