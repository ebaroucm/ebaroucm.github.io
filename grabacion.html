<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Respuesta oral — Práctica de Matemáticas</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
      color: #222;
    }

    button {
      padding: 12px 18px;
      margin: 8px 5px 8px 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #estado {
      margin-top: 20px;
      padding: 12px;
      background: #f1f1f1;
      border-radius: 6px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #cronometro {
      font-size: 1.5em;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Respuesta oral</h1>

  <p><strong>Pregunta:</strong></p>

  <p>Decidir razonadamente si la siguiente afirmación es verdadera o falsa:</p>

  <blockquote>
    Si S es una matriz definida positiva, entonces S² es definida positiva.
  </blockquote>

  <p>Dispones de un máximo de tres minutos para responder.</p>

  <button id="iniciar">Comenzar grabación</button>
  <button id="detener" disabled>Terminar grabación</button>

  <p id="cronometro">03:00</p>

  <div id="estado">
    Pulsa «Comenzar grabación» cuando estés preparado.
  </div>

  <script>
    // URL de la aplicación web de Google Apps Script.
    const URL_APPS_SCRIPT =
      'https://script.google.com/a/macros/ucm.es/s/AKfycbwdWcC5Dyoc2ClpzbGpmzMdwo9IR27kNIjJDoue0teXDPcFpMQIAzT1s3Yc0k1zyhCzkQ/exec';

    const iniciarBtn = document.getElementById('iniciar');
    const detenerBtn = document.getElementById('detener');
    const estado = document.getElementById('estado');
    const cronometro = document.getElementById('cronometro');

    // El identificador se recibe en la dirección:
    // grabacion.html?id=IDENTIFICADOR
    const id = new URLSearchParams(window.location.search).get('id');

    let grabador = null;
    let fragmentos = [];
    let flujo = null;
    let temporizador = null;
    let segundosRestantes = 180;
    let grabacionTerminada = false;

    function mostrarTiempo() {
      const minutos = Math.floor(segundosRestantes / 60);
      const segundos = segundosRestantes % 60;

      cronometro.textContent =
        String(minutos).padStart(2, '0') + ':' +
        String(segundos).padStart(2, '0');
    }

    function mostrarError(mensaje) {
      estado.textContent = mensaje;
    }

    iniciarBtn.addEventListener('click', async () => {
      iniciarBtn.disabled = true;
      estado.textContent = 'Solicitando permiso para utilizar el micrófono…';

      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            'El navegador no permite acceder al micrófono desde esta página.'
          );
        }

        flujo = await navigator.mediaDevices.getUserMedia({
          audio: true
        });

        let opciones = {};

        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          opciones.mimeType = 'audio/webm;codecs=opus';
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
          opciones.mimeType = 'audio/mp4';
        } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
          opciones.mimeType = 'audio/ogg;codecs=opus';
        }

        grabador = new MediaRecorder(flujo, opciones);
        fragmentos = [];
        grabacionTerminada = false;

        grabador.addEventListener('dataavailable', evento => {
          if (evento.data && evento.data.size > 0) {
            fragmentos.push(evento.data);
          }
        });

        grabador.addEventListener('stop', () => {
          clearInterval(temporizador);

          if (flujo) {
            flujo.getTracks().forEach(pista => pista.stop());
          }

          grabacionTerminada = true;

          const blob = new Blob(fragmentos, {
            type: grabador.mimeType || 'audio/webm'
          });

          mostrarGrabacion(blob);
        });

        grabador.start();

        segundosRestantes = 180;
        mostrarTiempo();

        detenerBtn.disabled = false;
        estado.textContent = 'Grabando. Habla con claridad.';

        temporizador = setInterval(() => {
          segundosRestantes--;
          mostrarTiempo();

          if (segundosRestantes <= 0 &&
              grabador.state === 'recording') {
            grabador.stop();
            detenerBtn.disabled = true;
          }
        }, 1000);

      } catch (error) {
        if (flujo) {
          flujo.getTracks().forEach(pista => pista.stop());
        }

        iniciarBtn.disabled = false;

        mostrarError(
          'No se pudo iniciar la grabación: ' +
          error.name + ' — ' + error.message
        );
      }
    });

    detenerBtn.addEventListener('click', () => {
      if (grabador && grabador.state === 'recording') {
        grabador.stop();
        detenerBtn.disabled = true;
      }
    });

    function mostrarGrabacion(blob) {
      const url = URL.createObjectURL(blob);

      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = url;

      const mensaje = document.createElement('p');
      mensaje.textContent =
        'Grabación terminada. Puedes escucharla antes de enviarla.';

      const botonEnviar = document.createElement('button');
      botonEnviar.textContent = 'Enviar respuesta a Google Drive';

      estado.replaceChildren(
        mensaje,
        audio,
        document.createElement('br'),
        botonEnviar
      );

      botonEnviar.addEventListener('click', () => {
        enviarGrabacion(blob, botonEnviar);
      });
    }

    async function enviarGrabacion(blob, botonEnviar) {
      if (!id) {
        mostrarError(
          'Falta el identificador de la práctica. ' +
          'Debes entrar desde la aplicación principal.'
        );
        return;
      }

      if (!grabacionTerminada) {
        mostrarError('Primero debes terminar la grabación.');
        return;
      }

      botonEnviar.disabled = true;

      estado.textContent = 'Preparando el archivo para enviarlo…';

      console.log('Tamaño del audio:', blob.size);
      console.log('Formato del audio:', blob.type);

      try {
        const datos = await new Promise((resolve, reject) => {
          const lector = new FileReader();

          lector.onload = () => {
            const resultado = String(lector.result);
            resolve(resultado.substring(resultado.indexOf(',') + 1));
          };

          lector.onerror = () => reject(
            new Error('No se ha podido leer el archivo de audio.')
          );

          lector.onabort = () => reject(
            new Error('Se ha cancelado la lectura del audio.')
          );

          lector.readAsDataURL(blob);
        });

        console.log(
          'Audio convertido a base64. Caracteres:',
          datos.length
        );

        estado.textContent =
          'Audio preparado. Intentando enviarlo a Google Apps Script…';

        const mimeType = blob.type.split(';')[0];

        const extension = mimeType === 'audio/mp4'
          ? 'mp4'
          : mimeType === 'audio/ogg'
            ? 'ogg'
            : 'webm';

        const nombre = 'respuesta-oral.' + extension;

        const formulario = document.createElement('form');
        formulario.method = 'POST';
        formulario.action = URL_APPS_SCRIPT;
        formulario.target = 'marcoRespuesta';
        formulario.acceptCharset = 'UTF-8';
        formulario.style.display = 'none';

        const campos = {
          accion: 'guardarAudio',
          id: id,
          nombre: nombre,
          mimeType: mimeType,
          base64: datos
        };

        Object.entries(campos).forEach(([nombreCampo, valor]) => {
          const campo = document.createElement('input');
          campo.type = 'hidden';
          campo.name = nombreCampo;
          campo.value = valor;
          formulario.appendChild(campo);
        });

        document.body.appendChild(formulario);

        estado.textContent =
          'Enviando la grabación. No cierres esta página…';

        // Registrar el listener antes de enviar el formulario,
        // para no perder una respuesta rápida.
        const respuestaPromise = new Promise(resolve => {
          const temporizadorRespuesta = setTimeout(() => {
            window.removeEventListener('message', recibirRespuesta);
            resolve({
              correcto: false,
              mensaje:
                'No se ha recibido respuesta de Apps Script en 60 segundos.'
            });
          }, 60000);

          function recibirRespuesta(evento) {
            if (!evento.data ||
                evento.data.tipo !== 'resultadoGrabacion') {
              return;
            }

            clearTimeout(temporizadorRespuesta);
            window.removeEventListener('message', recibirRespuesta);
            resolve(evento.data.resultado);
          }

          window.addEventListener('message', recibirRespuesta);
        });

        formulario.submit();

        const resultado = await respuestaPromise;
        formulario.remove();

        if (resultado && resultado.correcto) {
          estado.textContent =
            '¡Grabación guardada correctamente en Google Drive! ' +
            'Puedes cerrar esta página.';
          iniciarBtn.disabled = true;
        } else {
          botonEnviar.disabled = false;

          mostrarError(
            'No se ha podido guardar la grabación: ' +
            (resultado && resultado.mensaje
              ? resultado.mensaje
              : 'Error desconocido.')
          );
        }

      } catch (error) {
        console.error('Error al enviar la grabación:', error);

        botonEnviar.disabled = false;

        mostrarError(
          'Error al preparar o enviar el audio: ' +
          error.message
        );
      }
    }

    // Marco oculto que recibe la respuesta de Apps Script.
    const marco = document.createElement('iframe');
    marco.name = 'marcoRespuesta';
    marco.id = 'marcoRespuesta';
    marco.style.display = 'none';
    document.body.appendChild(marco);
  </script>
</body>
</html>
